<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Anish Agarwal: I find where the time goes.</title>
<desc id="d">An animated flame graph in a profiler window. Frames rise from main() at the bottom, and a few glow like sampled frames.</desc>
<defs>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1c2c38" stroke-width="1"/></pattern>
<radialGradient id="g" cx="50%" cy="100%" r="75%"><stop offset="0" stop-color="#ff8a4c" stop-opacity=".5"/><stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/></radialGradient>
</defs>
<style>
.t{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f1c26}
.n{font:700 52px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#e9eef2;letter-spacing:-1.5px}
.s{font:600 26px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#ffb347;animation:fade 1s .5s backwards}
.m{font:400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8aa0b0;animation:fade 1s .9s backwards}
.c{font:400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8aa0b0}
.f{transform-box:fill-box;transform-origin:50% 100%;animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
.r0{animation-delay:.1s}.r1{animation-delay:.35s}.r2{animation-delay:.6s}.r3{animation-delay:.85s}.r4{animation-delay:1.1s}
.hl{fill:#fff;opacity:0;animation:glow 6s ease-in-out infinite}
@keyframes rise{from{transform:scaleY(0);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes glow{0%,12%,100%{opacity:0}6%{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="340" rx="14" fill="#0f1c26"/>
<rect width="1200" height="340" rx="14" fill="url(#gr)" opacity=".8"/>
<rect width="1200" height="340" rx="14" fill="url(#g)"/>
<rect x=".75" y=".75" width="1198.5" height="338.5" rx="13.5" fill="none" stroke="#26394a" stroke-width="1.5"/>
